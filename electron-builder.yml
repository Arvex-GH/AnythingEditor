appId: com.arvex.anythingeditor
productName: AnythingEditor
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: resources
    filter: ["**/*"]
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - "**/node_modules/@lydell/**"
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  artifactName: AnythingEditor-Setup-${version}.${ext}
  shortcutName: AnythingEditor
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: AnythingEditor-${version}-portable.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Development
  icon: build/icon.png
  executableName: anything-editor
  synopsis: Learn any programming language with an AI tutor and a LazyVim editor
  maintainer: Arvex-GH <arvex@users.noreply.github.com>
  vendor: Arvex-GH
  artifactName: AnythingEditor-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: AnythingEditor
      Comment: Learn any programming language with an AI tutor
      Keywords: code;learn;tutor;vim;neovim;programming;
      StartupWMClass: AnythingEditor
deb:
  recommends: [git, ripgrep, fd-find, build-essential, libsecret-1-0]
publish:
  provider: github
  owner: Arvex-GH
  repo: AnythingEditor
