name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v0.1.0). Leave empty to only build.'
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2 libarchive-tools
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --x64 --publish never
      - name: Smoke test (packaged app under Xvfb)
        run: SHOT_OUT=smoke-linux.jpg xvfb-run -a -s "-screen 0 1500x920x24" scripts/smoke-test.sh release/*/linux-unpacked/anything-editor
      - name: Smoke test (AppImage)
        run: |
          chmod +x release/*/AnythingEditor-*-x86_64.AppImage
          SHOT_OUT=smoke-appimage.jpg xvfb-run -a -s "-screen 0 1500x920x24" scripts/smoke-test.sh release/*/AnythingEditor-*-x86_64.AppImage
      - name: Install .deb and smoke test it
        run: |
          sudo apt-get install -y ./release/*/AnythingEditor-*-amd64.deb
          test -f /usr/share/applications/anything-editor.desktop && cat /usr/share/applications/anything-editor.desktop
          SHOT_OUT=smoke-deb.jpg xvfb-run -a -s "-screen 0 1500x920x24" scripts/smoke-test.sh /opt/AnythingEditor/anything-editor
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.tar.gz
            release/*/*.pkg.tar.xz
            release/*/latest-linux.yml
            smoke-*.jpg

  arch:
    # Arch Linux / Omarchy: install the pacman package for real, build the PKGBUILD, smoke-test both.
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare Arch
        run: |
          pacman -Syu --noconfirm --needed base-devel git xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux, path: artifacts }
      - name: Install .pkg.tar.xz with pacman
        run: |
          pkg=$(find artifacts -name '*.pkg.tar.xz' | head -n1)
          echo "Package: $pkg"
          pacman -Qip "$pkg"
          pacman -U --noconfirm "$pkg"
          pacman -Ql anything-editor | grep -E 'applications|bin/|icons' || true
          test -x /opt/AnythingEditor/anything-editor
      - name: Smoke test pacman package
        run: SHOT_OUT=smoke-arch.jpg xvfb-run -a -s "-screen 0 1500x920x24" scripts/smoke-test.sh /opt/AnythingEditor/anything-editor
      - name: Build PKGBUILD (anything-editor-bin) from the local tarball
        run: |
          pacman -R --noconfirm anything-editor
          version=$(sed -n 's/^  "version": "\(.*\)",/\1/p' package.json | head -n1)
          useradd -m builder
          mkdir /tmp/pkg && cp packaging/arch/PKGBUILD /tmp/pkg/
          sed -i "s/^pkgver=.*/pkgver=$version/" /tmp/pkg/PKGBUILD
          cp "$(find artifacts -name "AnythingEditor-$version-x64.tar.gz" | head -n1)" "/tmp/pkg/AnythingEditor-$version-x64.tar.gz"
          cp LICENSE "/tmp/pkg/LICENSE-$version"
          chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg -f --nodeps --noconfirm"
          pacman -U --noconfirm /tmp/pkg/anything-editor-bin-*.pkg.tar.*
          test -f /usr/share/applications/anything-editor.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/anything-editor.png
      - name: Smoke test PKGBUILD package
        run: SHOT_OUT=smoke-arch-pkgbuild.jpg xvfb-run -a -s "-screen 0 1500x920x24" scripts/smoke-test.sh /usr/bin/anything-editor
      - uses: actions/upload-artifact@v4
        with:
          name: arch-smoke
          path: smoke-*.jpg

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*/*.exe
            release/*/*.blockmap
            release/*/latest.yml

  release:
    needs: [linux, arch, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-artifacts }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          tarball=$(find dist-artifacts -name "AnythingEditor-$version-x64.tar.gz" | head -n1)
          license_sha=$(sha256sum LICENSE | cut -d' ' -f1)
          mkdir -p dist-artifacts/arch
          sed -e "s/^pkgver=.*/pkgver=$version/" \
              -e "s/^sha256sums=('SKIP'/sha256sums=('$(sha256sum "$tarball" | cut -d' ' -f1)'/" \
              -e "s/^            'SKIP')/            '$license_sha')/" \
              packaging/arch/PKGBUILD > dist-artifacts/arch/PKGBUILD
          cat dist-artifacts/arch/PKGBUILD | grep -A1 sha256sums
          files=$(find dist-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.pkg.tar.xz' -o -name 'PKGBUILD' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) | grep -v __uninstaller)
          echo "$files"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "AnythingEditor ${TAG#v}" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" $files --clobber
